# main에 푸시하면 Cloudflare Worker로 자동 배포한다. (public·src·wrangler.toml·이 파일이 바뀔 때)
# 필요한 저장소 Secret: CLOUDFLARE_API_TOKEN ("Cloudflare Workers 편집" 템플릿 토큰)
name: deploy
on:
  push:
    branches: [main]
    paths: ['public/**', 'src/**', 'wrangler.toml', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 문법 검사
        run: sed -n '/<script>/,/<\/script>/p' public/index.html | sed '1d;$d' > /tmp/g.js && node --check /tmp/g.js
      - name: 배포
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d90ec98e7b0eb49affe848bd93b2218a
