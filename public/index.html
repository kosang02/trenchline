<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15130e"><link rel="icon" href="data:,">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>참호전선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one column field console — views swap between title, campaign map, panel (reward/shop/event) and the 2:1 pixel battlefield */
:root{
  --bg:#15130e; --panel:#211e16; --panel2:#2a261c; --line:#3a3427; --fg:#e9dec3; --muted:#9b9077;
  --friend:#8fa04a; --friend-dim:#4c5629; --enemy:#8ea3b6; --alert:#d98b3a; --danger:#c8553d;
  --pix:"Silkscreen", ui-monospace, monospace;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding:0 16px;-webkit-tap-highlight-color:transparent}
.app{max-width:960px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.04em}
  .devtag{font-family:var(--pix);font-size:10px;letter-spacing:.08em;color:#14130c;background:var(--alert);padding:2px 6px}
h1 small{font-family:var(--pix);font-size:10px;color:var(--muted);margin-left:6px;letter-spacing:.12em}
.view{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:8px 14px;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{border-color:var(--friend);color:#f4f0dc}
:focus-visible{outline:2px solid var(--alert);outline-offset:1px}

/* title */
.title{border:2px solid var(--line);background:var(--panel);padding:28px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.title .logo{font-family:var(--pix);font-size:clamp(26px,7vw,44px);line-height:1;letter-spacing:.06em;color:var(--friend)}
.title p{margin:0;color:var(--muted);line-height:1.6;max-width:56ch;font-size:14px}
.account{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--line);padding-top:14px;width:100%}
.acc-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acc-row span{font-size:13px;color:var(--muted)}
.acc-row code{font-family:var(--pix);font-size:15px;letter-spacing:.08em;color:#e8c98a;background:var(--bg);border:2px solid var(--line);padding:6px 10px;user-select:all}
.title .account p.acc-note{font-size:12px}
.title .row{display:flex;gap:8px;flex-wrap:wrap}
.seed{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:2px solid var(--line);padding:8px 10px;width:170px;max-width:100%;text-transform:uppercase}
.seed::placeholder{text-transform:none;color:var(--muted)}
.title canvas{image-rendering:pixelated;width:100%;max-width:520px;height:auto}

/* status */
.status{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.status b{font-family:var(--pix);font-weight:400;color:var(--fg);font-variant-numeric:tabular-nums;margin-left:4px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font:inherit;font-size:11px;padding:3px 7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:4px;touch-action:manipulation}
.chip:hover,.chip.on{border-color:var(--alert)}
.ico{image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
.ico.sm{width:14px;height:14px}
.ico.lg{width:36px;height:36px}
.choice .ico.lg{margin-bottom:2px}
.og{width:96px;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;margin-bottom:4px}
.og.sm{width:28px;margin:0 4px 0 0;vertical-align:-3px}
.choice:disabled .og{filter:grayscale(1) brightness(.6)}
.og-st{display:inline-flex;align-items:center}
.relic-list li .ico{vertical-align:-3px;margin-right:4px}
.tip{box-sizing:border-box;position:fixed;z-index:50;background:var(--panel2);border:2px solid #8a6f3a;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px}
.tip-h{display:flex;gap:10px;align-items:center}
.tip-h em{display:block;font-style:normal;font-family:var(--pix);font-size:9px;letter-spacing:.1em;color:var(--alert)}
.tip-h b{font-size:15px}
.tip p{margin:0;font-size:13px;line-height:1.5;color:var(--fg)}
.tip p.lore{color:var(--muted);font-size:12px}
.chip.u{border-color:var(--friend-dim)}
.chip.r{border-color:#8a6f3a;color:#e8c98a}
.clears{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:13px}
.clears table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.clears th,.clears td{border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:400;color:var(--muted)}
.clears td.on{color:#e8c98a}
.clears td.lock{opacity:.4}
.clears p{margin:0;font-size:12px;color:var(--muted)}
.relic-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.relic-list li{font-size:13px;color:var(--muted);line-height:1.45}
.relic-list b{color:#e8c98a;font-weight:600}
.relic-list .no b{color:var(--muted)}
.merit{font-family:var(--pix);color:#e8c98a}
.chip i{font-style:normal;font-family:var(--pix);color:var(--alert);margin-left:3px}

/* map */
.mapwrap{overflow-x:auto;border:2px solid var(--line);background:var(--panel);-webkit-overflow-scrolling:touch}
.mapwrap svg{display:block}
.acthd{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px 0;font-size:13px}.acthd span{font-family:var(--pix);font-size:10px;color:var(--muted)}
.mapwrap line{stroke:var(--line);stroke-width:2;stroke-dasharray:3 3}
.mapwrap line.done{stroke:var(--friend);stroke-dasharray:none}
.node circle{fill:var(--panel2);stroke:var(--line);stroke-width:2}
.node text{fill:var(--muted);font-size:11px;text-anchor:middle;dominant-baseline:central;font-family:var(--body);pointer-events:none}
.node.done circle{fill:var(--friend-dim);stroke:var(--friend)}
.node.done text{fill:var(--fg)}
.node.reach{cursor:pointer}
.node.reach circle{stroke:var(--alert);fill:#3a2e1c}
.node.reach text{fill:var(--fg)}
.node.reach:hover circle{fill:#4a3a22}
.node.elite circle{stroke-dasharray:4 2}
.node.boss circle{stroke-width:3}
.node.lock{opacity:.45}
.legend{font-size:12px;color:var(--muted);margin:0;line-height:1.6}

/* panel */
.panel{border:2px solid var(--line);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:19px;text-wrap:balance}
.panel p{margin:0;color:var(--muted);line-height:1.6;font-size:14px;max-width:62ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.choice{font:inherit;text-align:left;color:var(--fg);background:var(--panel2);border:2px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0;touch-action:manipulation}
.choice:hover:not(:disabled){border-color:var(--alert)}
.choice:disabled{opacity:.4;cursor:default}
.choice .tag{font-family:var(--pix);font-size:9px;letter-spacing:.1em;color:var(--alert)}
.choice b{font-size:15px}
.choice span{font-size:13px;color:var(--muted);line-height:1.45}
.choice .price{font-family:var(--pix);font-size:12px;color:var(--alert)}

/* battle */
.hq{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:10px;color:var(--muted)}
.hpbar{width:72px;height:8px;background:var(--line);border:1px solid #000;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--friend)}
.hpbar.e i{background:var(--enemy);left:auto;right:0}
.btop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.btop .hq{margin-left:auto}
.mod{font-size:11px;border:1px solid var(--alert);color:var(--alert);padding:2px 6px}
.stage{position:relative;aspect-ratio:240/168;max-height:calc(100vh - 230px);margin-inline:auto;width:100%;border:2px solid var(--line);background:#000;touch-action:none;user-select:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#mini{width:100%;height:20px;display:block;image-rendering:pixelated;border:1px solid var(--line);background:var(--panel);touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:12px;background:rgba(14,12,8,.84);text-align:center;padding:16px}
.ov h2{margin:0;font-size:21px}
.ov p{margin:0;color:var(--muted);font-size:13px;max-width:46ch;line-height:1.55}
.evb{position:absolute;left:8px;right:8px;top:8px;background:rgba(14,12,8,.82);border:1px solid var(--alert);color:var(--fg);font-size:12px;padding:6px 8px;pointer-events:none}
.lsch{display:grid;gap:6px;width:min(100%,420px)}.lsch .btn{display:flex;flex-direction:column;gap:1px;text-align:left;padding:6px 10px}.lsch span{font-size:12px;color:var(--muted)}
.devbtn{position:fixed;right:10px;bottom:10px;z-index:60;font-family:var(--pix);font-size:10px;background:#7a2a1e;color:#fff;border:2px solid #17140e;padding:6px 8px;cursor:pointer}
.devpanel{position:fixed;right:10px;bottom:46px;z-index:60;display:grid;gap:6px;background:var(--panel);border:2px solid #7a2a1e;padding:10px;max-width:260px}.devpanel b{font-family:var(--pix);font-size:10px}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:50;background:var(--panel);border:2px solid var(--alert);padding:8px 14px;font-size:13px;max-width:calc(100% - 32px)}
.chip.v{border-color:#7a6a3a}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cp{font-family:var(--pix);font-size:20px;font-variant-numeric:tabular-nums;min-width:96px}
.cp span{font-size:10px;color:var(--muted);display:block;letter-spacing:.08em}
.cp span em{font-style:normal;color:var(--alert)}
.cp b{display:block;transition:color .2s}
.cp b.pay{color:#e8c98a}
.paybar{display:block;height:3px;background:var(--line);margin-top:3px;position:relative}
.paybar i{position:absolute;inset:0 auto 0 0;background:var(--alert);width:0}
.seg{display:flex;border:2px solid var(--line)}
.seg button{font:inherit;font-size:13px;background:var(--panel);color:var(--muted);border:0;padding:7px 12px;cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--friend);color:#14130c;font-weight:700}
.tools{display:flex;gap:6px;margin-left:auto}
.tools .btn{padding:6px 10px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.cards.sup{grid-template-columns:repeat(6,1fr)}
.card.sup{border-color:#5a4a2a;background:linear-gradient(var(--panel),#2a2216)}
.card.sup canvas{height:22px}
.chip.s{border-color:#5a4a2a;color:#e0c890}
.lo{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lo button{font:inherit;font-size:12px;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:5px 9px;display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.lo button[aria-pressed="true"]{border-color:var(--alert);background:#3a2e1c}
body.pc .app{max-width:1280px}
body.pc .card{padding:8px 4px 6px}
body.pc .card canvas{height:38px}
.card .cnt{position:absolute;top:3px;right:4px;font-family:var(--pix);font-size:10px;font-style:normal;color:var(--fg);opacity:.85}
.card .cnt:empty{display:none}
.card kbd{display:none;position:absolute;top:3px;left:4px;font-family:var(--pix);font-size:9px;color:var(--muted)}
body.pc .card kbd{display:block}
.keys{display:none;font-size:12px;color:var(--muted);margin:0;line-height:1.7}
body.pc .keys{display:block}
.keys kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);padding:0 4px;color:var(--fg);background:var(--panel)}
@media (max-width:620px){.cards{grid-template-columns:repeat(4,1fr)}.cards.sup{grid-template-columns:repeat(3,1fr)}.tools{margin-left:0}}
.card{position:relative;overflow:hidden;font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;touch-action:manipulation;min-width:0}
.card canvas{height:32px;image-rendering:pixelated;max-width:100%}
.card b{font-size:12px;font-weight:600;white-space:nowrap}
.card em{font-style:normal;font-family:var(--pix);font-size:11px;color:var(--alert)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--cd,0%);background:rgba(0,0,0,.55);pointer-events:none}
.card.poor{opacity:.45}
.card.aim{border-color:var(--alert)}
.ver{margin-left:auto;font-family:var(--pix);font-size:10px;color:var(--muted);white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
</style>

<div id="tip" class="tip" role="tooltip" hidden></div>
<div class="app">
  <header><h1>참호전선 <small>TRENCH LINE</small></h1><span id="devTag" class="devtag" hidden>테스트 서버</span><span id="ver" class="ver">__BUILD__</span></header>

  <section class="view" id="vTitle">
    <div class="title">
      <div class="logo">TRENCH LINE</div>
      <canvas id="titleArt" width="400" height="80"></canvas>
      <p>죽을 때마다 공적이 쌓여 영구 강화를 사고, 처음 발견한 유물은 도감에 남아 다음 작전에도 보너스를 줍니다. 열 개의 전선을 돌파해 적 사령부까지 진격하는 작전입니다. 전투에서 이기면 특성이나 새 병과를 얻고, 사령부 피해는 다음 전투까지 이어집니다. 사령부가 무너지면 처음부터 다시 시작합니다.</p>
      <div class="row">
        <input id="seedIn" class="seed" maxlength="16" placeholder="시드 (비우면 무작위)" aria-label="시드" autocomplete="off">
        <button class="btn primary" id="bNew">새 작전</button>
        <button class="btn" id="bCont" hidden>이어하기</button>
        <button class="btn" id="bDaily">오늘의 작전</button>
        <button class="btn" id="bMeta">사령부 보급창</button>
        <button class="btn" id="bMode">화면</button>
        <button class="btn" id="bLang" lang="en">English</button>
      </div>
      <p id="best"></p>
      <div id="account" class="account" hidden></div>
    </div>
  </section>

  <section class="view" id="vMap" hidden>
    <div class="status" id="mapStatus"></div>
    <div class="chips" id="mapChips"></div>
    <div class="mapwrap" id="mapWrap"></div>
  </section>

  <section class="view" id="vPanel" hidden>
    <div class="status" id="panelStatus"></div>
    <div class="panel">
      <h2 id="pTitle"></h2>
      <p id="pText"></p>
      <div class="choices" id="pChoices"></div>
      <div><button class="btn" id="pSkip" hidden></button></div>
    </div>
  </section>

  <section class="view" id="vBattle" hidden>
    <div class="btop"><span id="bName"></span><span class="mod" id="bMod" hidden></span>
      <div class="hq">아군<div class="hpbar"><i id="hpP"></i></div><div class="hpbar e"><i id="hpE"></i></div>적군</div></div>
    <div class="stage"><canvas id="cv"></canvas><div class="evb" id="evb" hidden></div><div class="ov" id="ov" hidden></div></div>
    <canvas id="mini" width="240" height="12"></canvas>
    <div class="bar">
      <div class="cp"><span>COMMAND PT <em id="payAmt"></em></span><b id="cp">0</b><i class="paybar"><i id="payBar"></i></i></div>
      <div class="seg" role="group" aria-label="부대 지시">
        <button data-st="advance" aria-pressed="false">전진</button>
        <button data-st="hold" aria-pressed="true">사수</button>
        <button data-st="fall" aria-pressed="false">후퇴</button>
      </div>
      <div class="tools">
        <button class="btn" id="bFront">전선 보기</button>
        <button class="btn" id="bSpeed">×1</button>
        <button class="btn" id="bPause">일시정지</button>
        <button class="btn" id="bSound">소리</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="cards sup" id="supCards"></div>
  </section>
</div>

<script>
(()=>{
/* ---------- i18n ---------- */
/* 번역 표. 왼쪽은 한국어 원문(코드 속 _t('...')와 화면 HTML 문구), 오른쪽에 영어를 채운다.
   빈 칸("")이면 한국어가 그대로 나온다. {0},{1}... 자리표시와 <b> 같은 태그는 지우지 말고 그대로 둔다. */
const I18N_EN={
  "부대 지시":"Orders",
  "시드":"Seed",
  "시드 (비우면 무작위)":"Seed (blank = random)",
  "소리":"Sound",
  "전선 보기":"View Front",
  "후퇴":"Fall Back",
  "사수":"Hold",
  "전진":"Advance",
  "적군":"Enemy",
  "아군":"Allied",
  "화면":"Display",
  "이어하기":"Continue",
  "새 작전":"New Operation",
  "죽을 때마다 공적이 쌓여 영구 강화를 사고, 처음 발견한 유물은 도감에 남아 다음 작전에도 보너스를 줍니다. 열 개의 전선을 돌파해 적 사령부까지 진격하는 작전입니다. 전투에서 이기면 특성이나 새 병과를 얻고, 사령부 피해는 다음 전투까지 이어집니다. 사령부가 무너지면 처음부터 다시 시작합니다.":"Every death earns Merit for permanent upgrades, and each Relic you find for the first time is logged in the Codex, giving a bonus to every future operation. Break through ten fronts and push on to the enemy HQ. Win a battle to gain a Perk or a new unit; HQ damage carries over to the next battle. If your HQ falls, you start over.",
  "테스트 서버":"Test Server",
  "참호전선":"Trench Line",
  "소총수":"Rifleman",
  "돌격조":"Assault Team",
  "기관총":"Machine Gun",
  "대전차병":"Anti-Tank",
  "저격수":"Sniper",
  "박격포":"Mortar",
  "전차":"Tank",
  "포격":"Barrage",
  "지정 지점 주변에 포탄 8발. 밀집한 보병에 강합니다.":"Drops 8 shells around the marked spot. Strong against packed infantry.",
  "연막탄":"Smoke",
  "10초간 연막. 연막 안에서 쏘는 적은 명중률이 절반이 됩니다.":"10 s of smoke. Enemies firing from inside it have half their hit chance.",
  "지뢰 살포":"Minefield",
  "반경 안에 지뢰 6개를 깝니다. 밟은 적은 크게 다칩니다.":"Lays 6 mines in the area. Enemies that step on them take heavy damage.",
  "구급 지원":"Field Aid",
  "반경 안 아군이 4초에 걸쳐 체력 12를 회복합니다.":"Heals allies in the area for 12 HP over 4 s.",
  "야포 사격":"Howitzer Strike",
  "4초 뒤 대형 포탄 한 발. 피해 80, 전차에도 통합니다. 움직이는 적은 피합니다.":"One heavy shell lands after 4 s. 80 damage; works on tanks. Moving enemies dodge it.",

  document.title=I18N_EN['참호전선']||'Trench Line';
  const sub=document.querySelector('header h1 small');if(sub)sub.remove();
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){const v=n.nodeValue,k=v.trim();if(k&&I18N_EN[k])n.nodeValue=v.replace(k,I18N_EN[k])}
  for(const el of document.querySelectorAll('[placeholder],[aria-label],[title]'))
    for(const at of ['placeholder','aria-label','title']){const v=el.getAttribute(at);if(v&&I18N_EN[v])el.setAttribute(at,I18N_EN[v])}
}

const CLOUD={api:'/api',on:false,code:null,timer:null,busy:false,last:0,msg:''};

function localSavedAt(){try{return +localStorage.getItem('trenchline.savedAt')||0}catch(e){return 0}}
function cloudSnapshot(){return {run:store.get('trenchline.run'),meta:store.get('trenchline.meta')}}
function cloudApply(data,savedAt){
  try{for(const k of ['run','meta']){const v=data&&data[k];if(v==null)localStorage.removeItem('trenchline.'+k);else localStorage.setItem('trenchline.'+k,JSON.stringify(v))}
    localStorage.setItem('trenchline.savedAt',String(savedAt))}catch(e){}

function cloudMark(){
  try{localStorage.setItem('trenchline.savedAt',String(Date.now()))}catch(e){}

}
async function api(path,opt){const r=await fetch(CLOUD.api+path,{cache:'no-store',headers:{'content-type':'application/json'},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status});return j}
async function cloudPush(keepalive){
  if(!CLOUD.on||!CLOUD.code)return;clearTimeout(CLOUD.timer);CLOUD.timer=null;
  try{const savedAt=localSavedAt()||Date.now();await api('/save/'+CLOUD.code,{method:'PUT',body:JSON.stringify({savedAt,data:cloudSnapshot()}),keepalive:!!keepalive});
    CLOUD.last=Date.now();CLOUD.msg='';}catch(e){CLOUD.msg=_t('저장 실패: ')+e.message+_t('. 다음 저장 때 다시 시도합니다.')}

}
async function cloudPull(force){
  if(!CLOUD.on||!CLOUD.code)return;
  CLOUD.err=false;
  try{const j=await api('/save/'+CLOUD.code);
    if(j.data&&(force||j.savedAt>localSavedAt())){cloudApply(j.data,j.savedAt);CLOUD.msg=_t('클라우드 저장을 불러왔습니다.')}
    else if(!force&&localSavedAt()>(j.savedAt||0))cloudPush();
    CLOUD.last=Date.now()}catch(e){CLOUD.err=true;CLOUD.msg=e.status===404?_t('이 코드의 계정이 없습니다.'):_t('불러오기 실패: ')+e.message}

}

function genMap(seed,floors){return seeded(seed,()=>floors===NEW_FLOORS?genActMap(floors):genMapInner())}
// 3막 지도: 막 안 위치 a(0~7). a=7 막 보스, a=6 휴식, 막마다 보급소·정예 하나씩 보장.
function genActMap(floors){
  const fl=[],bk=Object.keys(BIOMES);
  for(let f=0;f<floors;f++){
    const act=f/ACT|0,a=f%ACT,n=a===0||a===7?1:Math.random()<.4?3:2,row=[];
    for(let i=0;i<n;i++){
      let type='battle';
      if(a===7)type='boss';else if(a===6)type='rest';
      else if(a===1){const r=Math.random();type=r<.6?'battle':r<.85?'event':'shop'}
      else if(a>=2){const r=Math.random();type=r<.40?'battle':r<.54?(a>=3?'elite':'battle'):r<.67?'event':r<.78?'shop':r<.87?'rest':'cache'}
      const node={id:f+'-'+i,f,i,n,type,next:[],seed:Math.random()*4294967296>>>0};
      if((type==='battle'||type==='elite')&&a>=2&&Math.random()<(act===2?.6:.45))node.mod=pick(Object.keys(MODS));
      if(type==='boss'&&act===2)node.mod='arty';
      row.push(node)}
    fl.push(row)}
  for(let act=0;act*ACT<floors;act++){const rows=fl.slice(act*ACT+1,act*ACT+6).flat();
    if(!rows.some(n=>n.type==='shop')){const c=fl[act*ACT+4];const x=c[Math.random()*c.length|0];x.type='shop';delete x.mod}
    if(!rows.some(n=>n.type==='elite')){const c=fl[act*ACT+5];const x=c.find(n=>n.type!=='shop')||c[0];x.type='elite'}}
  link(fl);return fl;
}
function link(fl){
  for(let f=0;f<fl.length-1;f++){
    const A=fl[f],B=fl[f+1];
    for(const a of A){const j=A.length===1?(B.length-1)/2|0:Math.round(a.i/(A.length-1)*(B.length-1));
      a.next.push(j);if(Math.random()<.45){const k=j+(Math.random()<.5?1:-1);if(k>=0&&k<B.length&&!a.next.includes(k))a.next.push(k)}}
    if(A.length===1)A[0].next=B.map(b=>b.i);
    for(const b of B)if(!A.some(a=>a.next.includes(b.i))){let best=A[0];for(const a of A)if(Math.abs(a.i/A.length-b.i/B.length)<Math.abs(best.i/A.length-b.i/B.length))best=a;best.next.push(b.i)}
  }
}
function genMapInner(){
  const fl=[];
  for(let f=0;f<FLOORS;f++){
    const n=f===0||f===FLOORS-1?1:Math.random()<.4?3:2,row=[];
    for(let i=0;i<n;i++){
      let type='battle';
      if(f===FLOORS-1)type='boss';else if(f===FLOORS-2)type='rest';
      else if(f>0){const r=Math.random();
        type=r<.4?'battle':r<.54&&f>=3?'elite':r<.67?'event':r<.78&&f>=2?'shop':r<.87&&f>=2?'rest':r<.94&&f>=2?'cache':'battle'}
      const node={id:f+'-'+i,f,i,n,type,next:[],seed:Math.random()*4294967296>>>0};
      if((type==='battle'||type==='elite')&&f>=2&&Math.random()<.45)node.mod=pick(Object.keys(MODS));
      if(type==='boss')node.mod='arty';
      row.push(node)}
    fl.push(row)}
  for(let f=0;f<FLOORS-1;f++){
    const A=fl[f],B=fl[f+1];
    for(const a of A){const j=A.length===1?(B.length-1)/2|0:Math.round(a.i/(A.length-1)*(B.length-1));
      a.next.push(j);if(Math.random()<.45){const k=j+(Math.random()<.5?1:-1);if(k>=0&&k<B.length&&!a.next.includes(k))a.next.push(k)}}
    if(A.length===1)A[0].next=B.map(b=>b.i);
    for(const b of B)if(!A.some(a=>a.next.includes(b.i))){let best=A[0];for(const a of A)if(Math.abs(a.i/A.length-b.i/B.length)<Math.abs(best.i/A.length-b.i/B.length))best=a;best.next.push(b.i)}
  }

}

const AU={ctx:null,on:store.get('trenchline.sound')!==false,last:{},noise:null,master:null};
function audioInit(){

  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.ctx=new C();
    const b=AU.ctx.createBuffer(1,AU.ctx.sampleRate*2,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;

}
const SFX={rifle:{f:'bandpass',hz:1600,q:.9,dur:.14,g:.22,gap:.045},mg:{f:'bandpass',hz:1250,q:1.1,dur:.07,g:.13,gap:.035},
  boom:{f:'lowpass',hz:420,to:70,dur:1,g:.85,gap:.05},tank:{f:'lowpass',hz:900,to:150,dur:.55,g:.55,gap:.08},thump:{f:'lowpass',hz:500,to:200,dur:.25,g:.35,gap:.08},
  rocket:{f:'bandpass',hz:2400,to:500,q:2,dur:.45,g:.22,gap:.1},pop:{f:'lowpass',hz:900,to:200,dur:.35,g:.4,gap:.06},far:{f:'lowpass',hz:160,to:60,dur:1.6,g:.35,gap:.4},pay:{f:'bandpass',hz:3200,to:2400,q:6,dur:.12,g:.12,gap:.3},snipe:{f:'bandpass',hz:2200,to:600,q:.7,dur:.35,g:.4,gap:.08},flame:{f:'lowpass',hz:700,to:250,dur:.5,g:.3,gap:.18}};

  if(!AU.on||!AU.ctx||!S||S.paused)return;const c=AU.ctx,now=c.currentTime,P=SFX[type];
  if(AU.last[type]&&now-AU.last[type]<P.gap)return;
  const center=S.cam+VW/2,dx=x-center,vol=type==='far'?1:Math.max(0,1-Math.abs(dx)/300);if(vol<.05)return;AU.last[type]=now;
  try{const src=c.createBufferSource();src.buffer=AU.noise;src.playbackRate.value=R(.85,1.15);
    const f=c.createBiquadFilter();f.type=P.f;f.frequency.setValueAtTime(P.hz,now);if(P.to)f.frequency.exponentialRampToValueAtTime(P.to,now+P.dur);if(P.q)f.Q.value=P.q;
    const g=c.createGain();g.gain.setValueAtTime(P.g*vol*(mul||1),now);g.gain.exponentialRampToValueAtTime(.001,now+P.dur);

    src.connect(f);f.connect(g);out.connect(AU.master);src.start(now,Math.random());src.stop(now+P.dur+.05)}catch(e){}
}

function startBattle(n){

  render();ui();

  overlay(_t("<h2>{0}</h2><p>{1}{2}지형: {3}. {4}적 사령부 내구도 {5}, 아군 사령부 {6}/{7}.</p>{8}",$('#bName').textContent,boss?_t('적 사령부는 내구도가 높고 전차와 기관총이 미리 배치돼 있습니다. '):elite?_t('적이 진지를 미리 갖추고 있습니다. '):'',n.mod?MODS[n.mod].name+': '+MODS[n.mod].desc+'. ':'',[...new Set(CFG.terrain.feats.map(o=>FEAT[o.type].name))].join(', ')||_t('개활지'),(rk()>1?_t("등급 {0} {1}. ",rk(),RANKS[rk()].name):'')+(CFG.cmd?_t("적 지휘관: {0}({1}). {2} ",CMDRS[CFG.cmd].name,CMDRS[CFG.cmd].style,CMDRS[CFG.cmd].desc):''),CFG.ehq,RUN.hq,RUN.hqMax,loadoutPicker()),_t('작전 개시'),()=>{ov.hidden=true;S.paused=false;S.started=true;audioInit();soundLabel()});

function vetDied(u){const v=(RUN.vets||[]).find(x=>x.id===u.vet);if(!v)return;
  RUN.vets=RUN.vets.filter(x=>x!==v);floatText(u.x,u.y-18,VET_NAMES[v.n%VET_NAMES.length],'200,85,61');

function vetsAfter(){
  RUN.vets=RUN.vets||[];const alive=S.units.filter(u=>u.side===1&&u.type!=='apc');
  for(const u of S.units)if(u.cargo)alive.push(...u.cargo);
  for(const v of RUN.vets){const u=alive.find(x=>x.vet===v.id);if(u)v.k+=u.kills||0}
  const cand=alive.filter(u=>!u.vet&&(u.kills||0)>=3).sort((a,b)=>b.kills-a.kills);
  let id=RUN.vetId||0;const used=new Set(RUN.vets.map(v=>v.n));
  for(const u of cand){if(RUN.vets.length>=vetMax())break;let n=Math.random()*VET_NAMES.length|0;for(let j=0;j<VET_NAMES.length&&used.has(n);j++)n=(n+1)%VET_NAMES.length;used.add(n);

/* ---------- input ---------- */
let drag=null,aimX=null,aimY=FMID;
const toY=e=>{const r=cv.getBoundingClientRect();return (e.clientY-r.top)/r.height*VH};
const toWorld=e=>{const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*VW+S.cam};
cv.addEventListener('pointerdown',e=>{if(!S)return;drag={x:e.clientX,cam:S.cam,moved:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!S)return;if(S.aim){aimX=Math.round(toWorld(e));aimY=Math.round(clampY(toY(e)))}
  if(!drag)return;const r=cv.getBoundingClientRect(),dx=(e.clientX-drag.x)/r.width*VW;
  if(Math.abs(e.clientX-drag.x)>6)drag.moved=true;
  if(drag.moved){S.follow=false;S.cam=Math.max(0,Math.min(WORLD-VW,drag.cam-dx))}});
cv.addEventListener('pointerup',e=>{if(!S||!drag)return;
  if(!drag.moved&&!S.aim&&S.crates&&S.crates.length)grabCrate(toWorld(e),toY(e));
  if(!drag.moved&&S.aim){const x=toWorld(e);if(supReady(1,S.aim))callSupport(1,S.aim,x,toY(e));S.aim=false;aimX=null}
  drag=null});
cv.addEventListener('wheel',e=>{if(!S)return;e.preventDefault();S.follow=false;S.cam=Math.max(0,Math.min(WORLD-VW,S.cam+(e.deltaX||e.deltaY)*.3))},{passive:false});
mini.addEventListener('pointerdown',e=>{if(!S)return;const r=mini.getBoundingClientRect();S.follow=false;S.cam=Math.max(0,Math.min(WORLD-VW,(e.clientX-r.left)/r.width*WORLD-VW/2))});
const keysDown=new Set();let mouseEdge=0;
window.addEventListener('keydown',e=>{if($('#vBattle').hidden||!S||S.over)return;
  const k=e.key.toLowerCase();
  {const m=keyMap.find(p=>p[0]===k);if(m){cards[m[1]].click();return}}
  if(k==='q')setStance('advance');if(k==='w')setStance('hold');if(k==='e')setStance('fall');
  if(k==='f')S.follow=true;
  if(k===' '){e.preventDefault();$('#bPause').click()}
  if(e.key==='Tab'){e.preventDefault();$('#bSpeed').click()}
  if(e.key==='Escape'){S.aim=false;aimX=null}
  if(k==='a'||k==='d'||e.key==='ArrowLeft'||e.key==='ArrowRight'){keysDown.add(k==='a'||e.key==='ArrowLeft'?-1:1);e.preventDefault()}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='a'||e.key==='ArrowLeft')keysDown.delete(-1);if(k==='d'||e.key==='ArrowRight')keysDown.delete(1)});
cv.addEventListener('mousemove',e=>{if(MODE!=='pc'){mouseEdge=0;return}const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;mouseEdge=fx<.05?-1:fx>.95?1:0});
cv.addEventListener('mouseleave',()=>{mouseEdge=0});
function panStep(dt){let v=0;for(const d of keysDown)v+=d;if(!drag)v+=mouseEdge;if(v){S.follow=false;S.cam=Math.max(0,Math.min(WORLD-VW,S.cam+v*160*dt))}}

/* ---------- loop ---------- */
let last=performance.now(),acc=0,uiT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(S&&!$('#vBattle').hidden){
    if(!S.paused&&!S.over){acc+=dt*S.speed;while(acc>=1/60){step(1/60);acc-=1/60;if(S.over)break}}
    panStep(dt);
    if(S.follow){let f=HQ[1];for(const u of S.units)if(u.side===1&&u.x>f)f=u.x;
      const tgt=Math.max(0,Math.min(WORLD-VW,f-VW*.55));S.cam+=(tgt-S.cam)*Math.min(1,dt*3)}
    render();uiT-=dt;if(uiT<=0){ui();uiT=.1}
  }
  requestAnimationFrame(frame);
}
